<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" role="img" aria-labelledby="title desc">
  <title id="title">Jev chooses a subagent model; the Pi orchestrator stays fixed</title>
  <desc id="desc">A fixed Pi orchestrator sends a worker task through hard subscription and capability filters. Jev selects one exact eligible route or abstains. The route is revalidated before dispatch. Abstention uses only an eligible baseline or refuses. The worker result returns to the unchanged orchestrator for review.</desc>
  <rect width="1120" height="410" rx="16" fill="#0d1117"/>
  <g font-family="ui-sans-serif,system-ui,sans-serif">
    <text x="28" y="36" fill="#8b949e" font-size="12" letter-spacing="1.4">ONE WORKER TASK · ROUTING IS OPT-IN</text>
    <rect x="24" y="58" width="205" height="144" rx="12" fill="#161b22" stroke="#7ee787"/>
    <text x="40" y="88" fill="#7ee787" font-size="13" font-weight="700">PI ORCHESTRATOR</text>
    <text x="40" y="117" fill="#e6edf3" font-size="14">Current model stays fixed</text>
    <text x="40" y="140" fill="#8b949e" font-size="12">Thinking stays fixed</text>
    <text x="40" y="166" fill="#8b949e" font-size="12">Delegates a bounded task</text>
    <path d="M230 130 h22" stroke="#8b949e" stroke-width="2"/>
    <rect x="256" y="58" width="205" height="144" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="272" y="88" fill="#58a6ff" font-size="13" font-weight="700">1 · HARD FILTER</text>
    <text x="272" y="114" fill="#e6edf3" font-size="13">Native subscription OAuth</text>
    <text x="272" y="137" fill="#8b949e" font-size="12">Policy · risk · context</text>
    <text x="272" y="160" fill="#8b949e" font-size="12">Image/reasoning capability</text>
    <path d="M462 130 h22" stroke="#8b949e" stroke-width="2"/>
    <rect x="488" y="58" width="205" height="144" rx="12" fill="#161b22" stroke="#d2a8ff"/>
    <text x="504" y="88" fill="#d2a8ff" font-size="13" font-weight="700">2 · JEV RUBRIC</text>
    <text x="504" y="114" fill="#e6edf3" font-size="13">Exact route ID or abstain</text>
    <text x="504" y="137" fill="#8b949e" font-size="12">Task-fit descriptions</text>
    <text x="504" y="160" fill="#8b949e" font-size="12">Bounded, redacted excerpt</text>
    <path d="M694 130 h22" stroke="#8b949e" stroke-width="2"/>
    <rect x="720" y="58" width="176" height="144" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="736" y="88" fill="#ffa657" font-size="13" font-weight="700">3 · REVALIDATE</text>
    <text x="736" y="114" fill="#e6edf3" font-size="13">Exact route + policy</text>
    <text x="736" y="137" fill="#8b949e" font-size="12">Changed? Refuse</text>
    <text x="736" y="160" fill="#8b949e" font-size="12">No paid fallback</text>
    <path d="M897 130 h22" stroke="#8b949e" stroke-width="2"/>
    <rect x="924" y="58" width="172" height="144" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="940" y="88" fill="#7ee787" font-size="13" font-weight="700">4 · WORKER</text>
    <text x="940" y="114" fill="#e6edf3" font-size="13">Exact selected model</text>
    <text x="940" y="137" fill="#8b949e" font-size="12">Bounded owned session</text>
    <text x="940" y="160" fill="#8b949e" font-size="12">No automatic retry</text>
    <path d="M590 204 v32 h-350 v20" fill="none" stroke="#ffa657" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="359" y="231" fill="#ffa657" font-size="12">abstain / invalid / timeout</text>
    <rect x="24" y="260" width="438" height="64" rx="10" fill="#202026" stroke="#ffa657"/>
    <text x="40" y="287" fill="#e6edf3" font-size="13">Only eligible baseline; otherwise refuse</text>
    <text x="40" y="308" fill="#8b949e" font-size="12">Never silently switch to another alternative</text>
    <path d="M1010 204 v144 h-880 v-20" fill="none" stroke="#7ee787" stroke-width="2"/>
    <text x="407" y="366" fill="#7ee787" font-size="13">Worker result → same Pi orchestrator → independent review</text>
    <text x="28" y="394" fill="#6e7681" font-size="11">Heuristic task fit ≠ measured subscription-allowance savings. Jev evaluation has its own cost.</text>
  </g>
</svg>
